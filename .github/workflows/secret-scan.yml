name: Secret scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Server-side copy of the local hook, so `git commit --no-verify` cannot skip it.
      - name: Scan full history for sensitive files and secrets
        run: .githooks/check-secrets.sh range HEAD
