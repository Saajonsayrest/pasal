name: pasal_mobile
description: "PASAL shop app: stock, sales and customer credit"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Inter (English and numbers) and Noto Sans Devanagari (Nepali), both SIL Open Font License.
  # The licences are next to the files in assets/fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari_700Bold.ttf
          weight: 700
